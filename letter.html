<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open When Letter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="letter-page">
      <div class="letter-container">
        <img
          class="opening-gif"
          src="images/envelope-opening.GIF"
          alt="Envelope opening"
        />

        <div class="letter-text hidden">
          <h1 id="letter-title">Open When</h1>
          <p id="letter-message">Your letter is on the way.</p>
        </div>
      </div>

      <div class="song-player">
        <p class="song-label">Song for this letter</p>
        <div class="audio-controls">
          <audio id="letter-audio" controls preload="auto"></audio>
          <button id="mute-toggle" class="mute-toggle" type="button" aria-label="Mute or unmute song">
            🔊 Mute
          </button>
        </div>
        <p id="song-meta" class="song-meta">Pick a letter to start the song.</p>
      </div>

      <a href="index.html" class="back-link">Back to envelopes</a>
    </main>
  </body>
</html>
