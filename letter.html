<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open When Letter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="letter-page">
      <div class="letter-container">
        <img
          class="opening-gif"
          src="images/envelope-opening.GIF"
          alt="Envelope opening"
        />

        <div class="letter-text hidden">
          <h1 id="letter-title">Open When</h1>
          <p id="letter-message">Your letter is on the way.</p>
        </div>
      </div>

      <a href="index.html" class="back-link">Back to envelopes</a>
    </main>
  </body>
</html>
